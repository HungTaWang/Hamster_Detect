name: Deploy to GitHub Pages

on:
  # 每當推送到 main 分支時觸發
  push:
    branches:
      - main
  # 允許手動從 Actions 頁籤觸發
  workflow_dispatch:

# 設定 GITHUB_TOKEN 的權限，以便將構建後的檔案推送到 gh-pages 分支
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
